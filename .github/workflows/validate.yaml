name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Lint
        run: docker compose run --rm ruff
      - name: Check formatting
        run: docker compose run --rm ruff format --check --no-cache .
      - name: Check bundled card JavaScript
        run: node --check custom_components/ff_agent/frontend/ff-agent-card.js
      - name: Integration smoke test
        run: docker compose run --rm --no-deps --entrypoint python homeassistant -m unittest discover -s /tests -v
      - name: Check Home Assistant configuration
        run: docker compose run --rm --no-deps --entrypoint python homeassistant -m homeassistant --script check_config --config /config

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Home Assistant integration metadata
        uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS integration repository
        uses: hacs/action@main
        with:
          category: integration
          comment: false
